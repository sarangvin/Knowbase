<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Deliberately NOT viewport-fit=cover: it expands the layout viewport to
         the whole physical display, which left the layout wider than the
         visible area on Android and cropped ~35px off the right of every
         screen. env(safe-area-inset-*) just resolves to 0 without it, which
         the bottom nav handles fine. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Neutral on purpose: the static HTML is served to anyone who requests
         this URL, so the title must not confirm an admin panel lives here.
         AdminApp sets the real title once it knows the viewer is the owner. -->
    <title>Rabbithole</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
