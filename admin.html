<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve
         to anything but 0, which the bottom nav uses to clear the iOS home
         indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Neutral on purpose: the static HTML is served to anyone who requests
         this URL, so the title must not confirm an admin panel lives here.
         AdminApp sets the real title once it knows the viewer is the owner. -->
    <title>Rabbithole</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
